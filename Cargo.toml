[workspace]
resolver = "2"
members = [
    "crates/weld-lang",
    "crates/weld-synth",
    "crates/weld-gate",
    "crates/weld-audit",
    "crates/weld-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Oreoro/weld"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[profile.release]
lto = true
strip = true
codegen-units = 1
